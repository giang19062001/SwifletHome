# MẢNG / DANH SÁCH CÁC PREFIX API NGOẠI LỆ CHO SENSOR (Cho phép chạy HTTP không bị redirect 301 sang HTTPS)
map $request_uri $is_sensor_http_api {
    default 0;
    
    # Danh sách mảng các đường dẫn API ngoại lệ:
    ~^/api/app/sensor/    1; # Áp dụng cho tất cả API bắt đầu bằng /api/app/sensor/*
}

server {
   server_name 3fam.ai www.3fam.ai;
   root /var/www/SwifletHome/public;
   client_max_body_size 100M;

   location / {
        proxy_pass http://127.0.0.1:3502;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Mặc định nginx sẽ nhận hết file rồi mới gửi backend
        # OFF => stream dữ liệu trực tiếp sang backend
        # Giúp backend nhận request sớm hơn khi upload file lớn
        proxy_request_buffering off;

        # Tăng timeout cho upload video/file lớn
        client_body_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
   }

   # Định tuyến toàn bộ file /uploads/ trực tiếp sang MinIO Docker Object Storage
   location /uploads/ {
        proxy_pass http://127.0.0.1:9000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hỗ trợ HTTP Range Requests cho streaming Video và Audio
        proxy_force_ranges on;

        # Caching trên trình duyệt 30 ngày & CORS
        expires 30d;
        add_header Cache-Control "public, no-transform, max-age=2592000";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header Access-Control-Allow-Headers "Range, Authorization, Content-Type";

        # Ẩn header nội bộ MinIO/S3
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-bucket-region;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header Server;

        # Cơ chế dự phòng: Nếu MinIO trả về 404, tự động chuyển tiếp về backend
        proxy_intercept_errors on;
        error_page 404 = @fallback_backend;
   }

   # Location dự phòng chuyển tiếp về backend
   location @fallback_backend {
        proxy_pass http://127.0.0.1:3502;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
   }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/3fam.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/3fam.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    listen 80;
    server_name 3fam.ai www.3fam.ai;

    # Kiểm tra nếu request nằm trong mảng API ngoại lệ sensor -> Cho phép proxy trực tiếp qua HTTP Port 80
    location / {
        if ($is_sensor_http_api = 1) {
            proxy_pass http://127.0.0.1:3502;
            break;
        }
        return 301 https://$host$request_uri;
    }

    # Proxy hỗ trợ cho các sub-path sensor
    location ~ ^/api/app/(sensor)/ {
        proxy_pass http://127.0.0.1:3502;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
