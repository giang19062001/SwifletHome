# Nginx configuration for minio.3fam.ai
# Reverse proxying to MinIO Console running on 127.0.0.1:9001 (Web Dashboard)
# and MinIO S3 API on 127.0.0.1:9000

server {
    server_name minio.3fam.ai;

    # Cho phép upload file lớn không giới hạn qua MinIO Web UI
    client_max_body_size 0;

    # 1. MinIO Console Web UI Dashboard (hỗ trợ WebSocket)
    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tắt buffering cho MinIO Web UI streaming
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 2. Hỗ trợ truy cập trực tiếp S3 API cho bucket /uploads/ qua tên miền minio.3fam.ai
    location /uploads/ {
        proxy_pass http://127.0.0.1:9000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hỗ trợ tua Video và Audio (HTTP Range Requests)
        proxy_force_ranges on;

        # Caching trên trình duyệt 30 ngày & CORS
        expires 30d;
        add_header Cache-Control "public, no-transform, max-age=2592000";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header Access-Control-Allow-Headers "Range, Authorization, Content-Type";

        # Ẩn header nội bộ MinIO/S3
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-bucket-region;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header Server;
    }

    access_log /var/log/nginx/minio.3fam.ai.access.log;
    error_log /var/log/nginx/minio.3fam.ai.error.log;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/jenkins.3fam.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jenkins.3fam.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = minio.3fam.ai) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name minio.3fam.ai;
    return 404;
}
