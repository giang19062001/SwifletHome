# Nginx configuration for mqtt.3fam.ai
# Proxying traffic to Mosquitto MQTT broker running on 127.0.0.1:1883

server {
    server_name mqtt.3fam.ai;

    location / {
        proxy_pass http://127.0.0.1:1883;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for MQTT persistent connections / WebSockets
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    access_log /var/log/nginx/mqtt.3fam.ai.access.log;
    error_log /var/log/nginx/mqtt.3fam.ai.error.log;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/jenkins.3fam.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jenkins.3fam.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = mqtt.3fam.ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name mqtt.3fam.ai;
    return 404; # managed by Certbot


}