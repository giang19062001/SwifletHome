# Nginx configuration for jenkins.3fam.ai
# Reverse proxying to Jenkins running on 127.0.0.1:8080

server {
    server_name jenkins.3fam.ai;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Jenkins streaming & large file upload settings
        proxy_max_temp_file_size 0;
        client_max_body_size 100m;
        client_body_buffer_size 128k;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    access_log /var/log/nginx/jenkins.3fam.ai.access.log;
    error_log /var/log/nginx/jenkins.3fam.ai.error.log;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/jenkins.3fam.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jenkins.3fam.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = jenkins.3fam.ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name jenkins.3fam.ai;
    return 404; # managed by Certbot


}